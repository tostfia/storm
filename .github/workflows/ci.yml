# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Maven Build & Dependency Submission

on:
  push:
    branches: [ testing ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: '17'

    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Build with Maven
      run: mvn clean install --batch-mode

    - name: Check if Dependency Graph is enabled
      id: check_graph
      run: |
        RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.MY_PAT_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/${{ github.repository }}/vulnerability-alerts)
        if [[ "$RESPONSE" == *"true"* ]]; then
          echo "Dependency Graph is enabled"
          echo "enabled=true" >> $GITHUB_ENV
        else
          echo "Dependency Graph is NOT enabled"
          echo "enabled=false" >> $GITHUB_ENV
        fi

    - name: Submit Maven dependencies
      if: env.enabled == 'true'
      uses: github/advanced-security/maven-dependency-submission-action@v1
      with:
        github-token: ${{ secrets.MY_PAT_TOKEN }}
      continue-on-error: true

    - name: Warn if Dependency Graph disabled
      if: env.enabled == 'false'
      run: |
        echo "⚠️ Dependency Graph is disabled. Skipping submission of Maven dependencies."

