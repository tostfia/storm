name: Java CI Debug with Maven

on:
  push:
    branches: [ "testing" ]
  pull_request:
    branches: [ "testing" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Debug environment
        run: |
          echo "Java version:"
          java -version
          echo "Maven version:"
          mvn -version
          echo "Current directory:"
          pwd
          echo "Files in workspace:"
          ls -R

      - name: Ensure a clean state without storm artifacts
        run: rm -rf ~/.m2/repository/org/apache/storm

      - name: Run build (debug mode)
        run: |
          set -euxo pipefail
          export JDK_VERSION=17
          export USER=github
          /bin/bash ./dev-tools/gitact/gitact-install.sh `pwd`
          /bin/bash ./dev-tools/gitact/gitact-script.sh `pwd` Client
